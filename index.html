<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة الموقع</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.1);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            line-height: 2;
        }

        a {
            color: #007bff;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>مشاركة الموقع</h2>

    <p>اضغط على الزر للسماح بمشاركة موقعك.</p>

    <button onclick="getLocation()">
        مشاركة موقعي
    </button>

    <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "ضع Project URL هنا";
const SUPABASE_PUBLISHABLE_KEY = "ضع Publishable Key هنا";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

function getLocation() {

    const result = document.getElementById("result");

    if (!navigator.geolocation) {
        result.textContent = "المتصفح لا يدعم تحديد الموقع.";
        return;
    }

    result.textContent = "جاري طلب إذن الموقع...";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            result.textContent = "جاري حفظ الموقع...";

            const { error } = await supabase
                .from("locations")
                .insert({
                    latitude: latitude,
                    longitude: longitude,
                    accuracy: accuracy
                });

            if (error) {
                console.error(error);
                result.textContent =
                    "حدث خطأ أثناء حفظ الموقع.";
                return;
            }

            const mapUrl =
                "https://www.google.com/maps?q="
                + latitude + "," + longitude;

            result.innerHTML = `
                <strong>تم حفظ الموقع بنجاح ✅</strong>
                <br><br>
                خط العرض: ${latitude}
                <br>
                خط الطول: ${longitude}
                <br>
                <a href="${mapUrl}" target="_blank">
                    📍 فتح الموقع على Google Maps
                </a>
            `;
        },

        function(error) {

            if (error.code === 1) {
                result.textContent =
                    "تم رفض إذن مشاركة الموقع.";
            } else {
                result.textContent =
                    "تعذر الحصول على الموقع.";
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
