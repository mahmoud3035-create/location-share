<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة الموقع</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 25px;
            line-height: 2;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>مشاركة الموقع</h2>

    <p>
        اضغط على الزر أدناه للسماح بمشاركة موقعك.
    </p>

    <button onclick="getLocation()">
        مشاركة موقعي
    </button>

    <div id="result"></div>

</div>

<script>

function getLocation() {

    const result = document.getElementById("result");

    if (!navigator.geolocation) {

        result.innerHTML =
            "المتصفح لا يدعم تحديد الموقع.";

        return;
    }

    result.innerHTML =
        "جاري طلب إذن الموقع...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                Math.round(position.coords.accuracy);

            const mapUrl =
                "https://www.google.com/maps?q="
                + latitude + "," + longitude;

            result.innerHTML = `

                <strong>تم الحصول على الموقع بنجاح ✅</strong>

                <br><br>

                خط العرض:
                ${latitude}

                <br>

                خط الطول:
                ${longitude}

                <br>

                الدقة التقريبية:
                ${accuracy} متر

                <br>

                <a href="${mapUrl}" target="_blank">
                    📍 فتح الموقع على Google Maps
                </a>

            `;
        },

        function(error) {

            if (error.code === 1) {

                result.innerHTML =
                    "❌ تم رفض إذن مشاركة الموقع.";

            } else if (error.code === 2) {

                result.innerHTML =
                    "❌ تعذر تحديد الموقع.";

            } else if (error.code === 3) {

                result.innerHTML =
                    "❌ انتهت مهلة تحديد الموقع.";

            } else {

                result.innerHTML =
                    "❌ حدث خطأ أثناء تحديد الموقع.";

            }
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
